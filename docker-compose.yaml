services:

  frontend:
    build:
      context: ./client
    container_name: green-pitch-frontend
    ports:
      - "5173:5000"
    depends_on:
      - backend
    networks:
      - green-pitch-network

  backend:
    build:
      context: ./server
    container_name: green-pitch-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    networks:
      - green-pitch-network
    volumes:
      - ./server/uploads:/app/uploads

  mongodb:
    image: mongo:8
    container_name: green-pitch-mongodb
    ports:
      - "27017:27017"
    volumes:
      - green-pitch-mongo-data:/data/db
    networks:
      - green-pitch-network
    
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: green-pitch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - green-pitch-network

  grafana:
    image: grafana/grafana:13.2.4
    container_name: green-pitch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${SMTP_USER}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${SMTP_USER}
      GF_SMTP_FROM_NAME: GreenPitch Alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - green-pitch-network
    
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: green-pitch-node-exporter
    restart: unless-stopped
    networks:
      - green-pitch-network

  loki:
    image: grafana/loki:3.7.0
    container_name: green-pitch-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - green-pitch-network

  alloy:
    image: grafana/alloy:v1.21.0
    container_name: green-pitch-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - green-pitch-network

networks:
  green-pitch-network:
    driver: bridge

volumes:
  green-pitch-mongo-data:
  prometheus_data:
  grafana_data:
  loki_data: