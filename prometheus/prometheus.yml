global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus monitors itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Enable this once your backend exposes /metrics (see note below)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]